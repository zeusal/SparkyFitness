name: Manually Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag"
        required: true
        default: "dev"
      service:
        description: "Target to build (all or a specific service)"
        type: choice
        default: "all"
        options:
          - all
          - frontend
          - server
          - garmin

jobs:
  push_to_registries:
    name: Push Docker image to multiple registries
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    env:
      # Docker Hub is optional so a fork can run this workflow. A fork has no
      # DOCKER_USERNAME/DOCKER_PASSWORD, and docker/login-action fails outright on
      # empty credentials, so the job used to die on its second step -- leaving
      # "delete the Docker Hub bits locally" as the only way to test a build, which
      # then had to be undone before every pull request.
      # Read via env because the secrets context is not available in a step-level
      # `if`; job-level env is where it can be resolved.
      DOCKERHUB_ENABLED: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # GHCR rejects uppercase image names and the owner/repo slug has them
      # (CodeWithCJ/SparkyFitness). Mirrors auto-docker-deploy.yml, which already
      # does this; metadata-action lowercases what it publishes on its own, but
      # attest-build-provenance takes subject-name verbatim and would disagree.
      - name: Set lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Metadata frontend
        id: meta-frontend
        if: ${{ inputs.service == 'all' || inputs.service == 'frontend' }}
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_ENABLED == 'true' && format('{0}/sparkyfitness', secrets.DOCKER_USERNAME) || '' }}
            ghcr.io/${{ steps.repo.outputs.name }}-frontend
          tags: |
            type=raw,value=${{ inputs.tag }}

      - name: Build and push frontend
        id: push-frontend
        if: ${{ inputs.service == 'all' || inputs.service == 'frontend' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation Frontend
        if: ${{ inputs.service == 'all' || inputs.service == 'frontend' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ steps.repo.outputs.name }}-frontend
          subject-digest: ${{ steps.push-frontend.outputs.digest }}
          push-to-registry: true

      # ── Server ────────────────────────────────────────────────────────────────
      - name: Metadata server
        id: meta-server
        if: ${{ inputs.service == 'all' || inputs.service == 'server' }}
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_ENABLED == 'true' && format('{0}/sparkyfitness_server', secrets.DOCKER_USERNAME) || '' }}
            ghcr.io/${{ steps.repo.outputs.name }}-server
          tags: |
            type=raw,value=${{ inputs.tag }}

      - name: Build and push server
        id: push-server
        if: ${{ inputs.service == 'all' || inputs.service == 'server' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation server
        if: ${{ inputs.service == 'all' || inputs.service == 'server' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ steps.repo.outputs.name }}-server
          subject-digest: ${{ steps.push-server.outputs.digest }}
          push-to-registry: true

      # ── Garmin Microservice ───────────────────────────────────────────────────
      - name: Metadata Garmin Microservice
        id: meta-garmin
        if: ${{ inputs.service == 'all' || inputs.service == 'garmin' }}
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_ENABLED == 'true' && format('{0}/sparkyfitness_garmin', secrets.DOCKER_USERNAME) || '' }}
            ghcr.io/${{ steps.repo.outputs.name }}-garmin
          tags: |
            type=raw,value=${{ inputs.tag }}

      - name: Build and push Garmin Microservice
        id: push-garmin
        if: ${{ inputs.service == 'all' || inputs.service == 'garmin' }}
        uses: docker/build-push-action@v6
        with:
          context: SparkyFitnessGarmin
          file: docker/Dockerfile.garmin_microservice
          push: true
          tags: ${{ steps.meta-garmin.outputs.tags }}
          labels: ${{ steps.meta-garmin.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation Garmin Microservice
        if: ${{ inputs.service == 'all' || inputs.service == 'garmin' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ steps.repo.outputs.name }}-garmin
          subject-digest: ${{ steps.push-garmin.outputs.digest }}
          push-to-registry: true
