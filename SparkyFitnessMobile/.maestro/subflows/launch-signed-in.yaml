# Opens the app under test as it is: no clearState, no permission changes.
# The app must already be signed in to a server.
#
# With a development build, Metro must be running and reachable
# (`pnpm start`, plus `adb reverse tcp:8081 tcp:8081` for a USB phone): the dev
# client then reopens the last project. A Release build needs nothing else.
appId: ${APP_ID}
---
- launchApp:
    # Maestro grants every permission on launch unless told otherwise. An empty
    # map leaves the app's permissions exactly as they are.
    permissions: {}
    label: Launch the app without clearing it
- extendedWaitUntil:
    visible:
      # Bottom-most "Library": the tab bar, not a Library tile or title.
      text: 'Library'
      index: -1
    timeout: 90000 # a dev build may wait for Metro to bundle
    label: Wait for the tab bar (is the app signed in and Metro running?)
- runFlow: dismiss-overlays.yaml
