packages:
  - "frontend"
  - "SparkyFitnessFrontend"
  - "shared"
  - "SparkyFitnessMobile"
  - "SparkyFitnessServer"
  - "docs"
  - "SparkyFitnessMCP"

packageExtensions:
  "@kingstinct/react-native-healthkit@13":
    dependencies:
      "@expo/config-plugins": "^55.0.0"
  # uniwind's metro plugin does `require("metro/private/DeltaBundler/Graph")` and
  # `require("metro-cache/private/stores/FileStore")` but doesn't declare those as deps.
  # Inject them so pnpm puts them in uniwind's resolution scope.
  "uniwind":
    dependencies:
      "metro": "*"
      "metro-cache": "*"

onlyBuiltDependencies:
  - "@scarf/scarf"
  - "@shopify/react-native-skia"
  - "@swc/core"
  - "@parcel/watcher"
  - bcrypt
  - sharp
  - esbuild
  - unrs-resolver
  - vue-demi

# Migrated from the now-ignored `pnpm` field in the root package.json (pnpm 10
# reads these settings from pnpm-workspace.yaml instead).
overrides:
  side-channel: "1.0.6"
  tailwindcss: "4.2.1"
  assistant-cloud: "0.1.33"
  zustand: "5.0.14"

patchedDependencies:
  "react-native-health-connect@3.5.3": "patches/react-native-health-connect@3.5.3.patch"

supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
    - arm64

minimumReleaseAge: 4320

minimumReleaseAgeExclude: []
